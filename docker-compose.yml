services:

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: supportsphere-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: supportsphere-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ./ai-service
    container_name: supportsphere-ai
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env