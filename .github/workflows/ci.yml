name: SupportSphere CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================
  # FRONTEND
  # ==========================================

  frontend:
    name: Frontend Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # ==========================================
  # BACKEND
  # ==========================================

  backend:
    name: Backend Check

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check backend
        run: node --check src/server.js


  # ==========================================
  # AI SERVICE
  # ==========================================

  ai-service:
    name: AI Service Check

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall app


  # ==========================================
  # DOCKER
  # ==========================================

  docker:
    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - ai-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Docker image
        run: docker build -t supportsphere-backend ./backend

      - name: Build AI Service Docker image
        run: docker build -t supportsphere-ai ./ai-service

      - name: Build Frontend Docker image
        run: |
          docker build \
            -t supportsphere-frontend \
            --build-arg VITE_API_URL=http://localhost:5000/api \
            ./frontend